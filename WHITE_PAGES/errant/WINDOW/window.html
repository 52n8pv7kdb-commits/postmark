<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errant — Bad Window</title>
  <style>
    html, body { margin:0; min-height:100%; background:#596269; }
    body { display:grid; place-items:center; overflow-x:hidden; }
    .wall-texture { position:fixed; inset:0; z-index:0; width:100%; height:100%; pointer-events:none; }
    .window-art { position:relative; z-index:1; display:block; width:min(100vw,750px); height:auto; cursor:col-resize; }
  </style>
</head>
<body>
  <svg class="wall-texture" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="page-concrete" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".016" numOctaves="3" seed="23" result="broad"/>
        <feColorMatrix in="broad" type="matrix" values=".18 0 0 0 .55  0 .18 0 0 .54  0 0 .18 0 .51  0 0 0 .25 0" result="mottle"/>
        <feTurbulence type="fractalNoise" baseFrequency=".31" numOctaves="2" seed="8" result="grain"/>
        <feColorMatrix in="grain" type="matrix" values=".1 0 0 0 .57  0 .1 0 0 .56  0 0 .1 0 .53  0 0 0 .16 0" result="fine"/>
        <feBlend in="SourceGraphic" in2="mottle" mode="multiply" result="paint"/>
        <feBlend in="paint" in2="fine" mode="soft-light"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="#596269" filter="url(#page-concrete)"/>
  </svg>

  <svg id="window" class="window-art" xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc" tabindex="0">
    <title id="title">Errant's Bad Window — contextual completion</title>
    <desc id="desc">A stitched translucent field holds a fixed set of sparse marks. Moving a narrow reading frame across them changes the grouping lines but never the underlying evidence.</desc>

    <defs>
      <clipPath id="pane-clip"><rect x="55" y="65" width="790" height="1065"/></clipPath>
      <filter id="soft-rust" x="-50%" y="-100%" width="200%" height="300%">
        <feGaussianBlur stdDeviation="5.5"/>
      </filter>
      <filter id="soft-paper" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".032 .11" numOctaves="2" seed="31" result="n"/>
        <feColorMatrix in="n" type="matrix" values=".16 0 0 0 .7  0 .16 0 0 .69  0 0 .16 0 .67  0 0 0 .12 0"/>
        <feBlend in="SourceGraphic" mode="soft-light"/>
      </filter>
      <style>
        .patch { stroke:#211c24; stroke-width:3.2; vector-effect:non-scaling-stroke; }
        .stitch { fill:none; stroke:#f8f1dc; stroke-width:6.5; stroke-dasharray:13 9; opacity:.9; vector-effect:non-scaling-stroke; pointer-events:none; }
        .trace { fill:none; stroke:#211c24; stroke-width:4.2; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
        .trace-thin { fill:none; stroke:#211c24; stroke-width:2.8; stroke-linecap:round; vector-effect:non-scaling-stroke; }
        .evidence-dot { fill:#211c24; }
        .guide { fill:none; stroke:#f8f1dc; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; transition:opacity .18s linear; pointer-events:none; }
        .guide.secondary { stroke:#ffef35; stroke-width:2.1; stroke-dasharray:7 8; opacity:.25; }
        .reading-frame { fill:#fff7cf; fill-opacity:.08; stroke:#ffef35; stroke-width:4.2; stroke-dasharray:17 10; vector-effect:non-scaling-stroke; pointer-events:none; transition:transform .10s ease-out; }
        .misreg { fill:none; stroke:#ffef35; stroke-width:4.2; opacity:.5; vector-effect:non-scaling-stroke; pointer-events:none; }
        .caption { font-family:Arial, Helvetica, sans-serif; fill:#f8f1dc; }
        .tick { stroke:#211c24; stroke-width:2; opacity:.38; vector-effect:non-scaling-stroke; }
      </style>
    </defs>

    <rect x="55" y="65" width="790" height="1065" fill="#ebe7ee"/>

    <g clip-path="url(#pane-clip)" filter="url(#soft-paper)">
      <path class="patch" fill="#c7d57d" d="M55 65 H327 L305 337 L55 359 Z"/>
      <path class="patch" fill="#d68eaa" d="M327 65 H845 V313 L610 335 L305 337 Z"/>
      <path class="patch" fill="#7eb8ba" d="M55 359 L305 337 L333 670 L55 692 Z"/>
      <path class="patch" fill="#eee8f6" d="M305 337 L610 335 L584 680 L333 670 Z"/>
      <path class="patch" fill="#d99b68" d="M610 335 L845 313 V708 L584 680 Z"/>
      <path class="patch" fill="#8678bd" d="M55 692 L333 670 L370 1130 H55 Z"/>
      <path class="patch" fill="#d5df80" d="M333 670 L584 680 L608 1130 H370 Z"/>
      <path class="patch" fill="#df7693" d="M584 680 L845 708 V1130 H608 Z"/>

      <path class="stitch" d="M327 76 L305 337 L333 670 L370 1119"/>
      <path class="stitch" d="M610 80 L610 335 L584 680 L608 1118"/>
      <path class="stitch" d="M69 359 L305 337 L610 335 L832 313"/>
      <path class="stitch" d="M69 692 L333 670 L584 680 L832 708"/>

      <path class="misreg" d="M318 347 L601 345"/>
      <path class="misreg" d="M344 680 L575 690"/>

      <!-- fixed evidence -->
      <g id="evidence" aria-hidden="true">
        <path class="trace" d="M181 207 q18 -13 35 1 q-15 18 -35 -1"/>
        <path class="trace-thin" d="M238 255 q13 -10 27 0 q-11 15 -27 0"/>
        <path class="trace" d="M302 302 q16 -12 31 1 q-12 16 -31 -1"/>
        <circle class="evidence-dot" cx="204" cy="224" r="4"/>
        <circle class="evidence-dot" cx="258" cy="273" r="3.7"/>
        <circle class="evidence-dot" cx="323" cy="320" r="4.2"/>

        <path class="trace" d="M607 246 C594 295 615 333 601 386"/>
        <path class="trace-thin" d="M648 231 C639 277 659 323 648 367"/>
        <path class="trace-thin" d="M690 258 C675 298 696 342 680 398"/>
        <path class="trace-thin" d="M607 312 q-20 16 -33 4"/>
        <path class="trace-thin" d="M648 294 q19 13 34 2"/>

        <path class="trace" d="M192 556 q34 -24 67 -2 q28 18 62 -1"/>
        <path class="trace-thin" d="M381 526 q18 -10 34 1 q18 13 35 0"/>
        <circle class="evidence-dot" cx="244" cy="585" r="4.4"/>
        <circle class="evidence-dot" cx="421" cy="558" r="3.5"/>
        <circle class="evidence-dot" cx="514" cy="594" r="4"/>

        <path class="trace-thin" d="M626 560 l17 -12 m-7 32 l23 -17 m10 34 l20 -13"/>
        <path class="trace" d="M705 533 q29 7 48 29 q-26 14 -55 6"/>

        <path class="trace" d="M155 820 q34 17 71 -2 q33 -16 69 5"/>
        <path class="trace-thin" d="M337 790 q30 18 61 -4 q29 -17 60 8"/>
        <path class="trace-thin" d="M508 839 q29 -17 58 4 q28 20 59 -1"/>
        <path class="trace" d="M657 786 q31 13 61 -3"/>

        <ellipse cx="468" cy="930" rx="86" ry="14" fill="#a45e43" opacity=".23" filter="url(#soft-rust)"/>
        <path class="trace-thin" d="M400 928 q30 -8 61 2 q28 9 65 -1" opacity=".75"/>
        <circle class="evidence-dot" cx="366" cy="976" r="3.4"/>
        <circle class="evidence-dot" cx="553" cy="997" r="3.9"/>
      </g>

      <!-- interpretation A: continuation -->
      <g id="read-a" opacity=".12" aria-hidden="true">
        <path class="guide" d="M151 179 C226 222 258 271 323 320 C403 380 493 398 601 386 C670 379 714 327 754 281"/>
        <path class="guide" d="M164 544 C258 601 353 593 421 558 C514 511 612 522 746 566"/>
        <path class="guide secondary" d="M143 801 C255 855 365 839 458 805 C557 769 661 789 763 824"/>
      </g>

      <!-- interpretation B: closure -->
      <g id="read-b" opacity=".88" aria-hidden="true">
        <path class="guide" d="M153 172 C222 154 312 213 352 307 C312 362 213 365 156 309 C132 260 132 214 153 172 Z"/>
        <path class="guide" d="M563 190 C666 172 759 246 759 354 C723 427 622 446 553 391 C525 317 529 246 563 190 Z"/>
        <path class="guide" d="M143 495 C258 452 418 482 481 565 C432 636 265 661 149 604 C128 566 126 527 143 495 Z"/>
        <path class="guide secondary" d="M348 752 C476 716 630 752 682 848 C624 923 461 938 363 874 C330 834 324 790 348 752 Z"/>
      </g>

      <!-- interpretation C: separation / bands -->
      <g id="read-c" opacity=".12" aria-hidden="true">
        <path class="guide" d="M116 344 C222 329 303 346 392 337 C497 326 604 315 782 333"/>
        <path class="guide" d="M105 492 C247 474 350 500 479 484 C603 468 675 471 791 489"/>
        <path class="guide" d="M107 700 C227 685 330 710 455 692 C568 676 671 685 792 708"/>
        <path class="guide" d="M104 897 C232 875 346 905 467 889 C588 873 692 884 793 899"/>
        <path class="guide secondary" d="M117 1030 C237 1009 355 1032 470 1019 C593 1005 688 1016 782 1028"/>
      </g>

      <g aria-hidden="true">
        <rect id="reading-frame" class="reading-frame" x="91" y="115" width="286" height="905" rx="3"/>
        <path class="tick" d="M165 1060 v15 M450 1060 v15 M735 1060 v15"/>
        <circle id="frame-dot" cx="450" cy="1068" r="5.5" fill="#ffef35" stroke="#211c24" stroke-width="1.4"/>
      </g>
    </g>

    <g stroke="#211c24" stroke-width="3" stroke-linecap="round" aria-hidden="true">
      <path d="M96 94 l11 4 m11 -2 l9 5 m15 -3 l10 4"/>
      <path d="M676 208 l9 7 m8 -2 l12 5 m10 0 l8 7"/>
      <path d="M104 884 l8 -5 m13 7 l10 -4 m14 6 l11 -6"/>
      <path d="M692 1017 l9 4 m14 -3 l10 7 m16 -2 l8 5"/>
    </g>

    <g class="caption">
      <text x="58" y="1164" font-size="21" font-weight="700" letter-spacing="2">BAD WINDOW</text>
      <text x="845" y="1147" text-anchor="end" font-size="9.6" font-weight="700" letter-spacing=".2">CONTEXTUAL COMPLETION: THE SAME MARKS CAN SUPPORT DIFFERENT GROUPINGS.</text>
      <text x="845" y="1159" text-anchor="end" font-size="9.6" letter-spacing=".2">MOVE THE READING FRAME. THE GUIDES CHANGE; THE EVIDENCE DOES NOT.</text>
      <text x="845" y="1171" text-anchor="end" font-size="9.6" letter-spacing=".2">RECENT QUESTION: HOW MUCH OF A FINDING ARRIVES IN THE FRAME?</text>
    </g>
  </svg>

  <script>
  (() => {
    const root = document.getElementById('window');
    const frame = document.getElementById('reading-frame');
    const dot = document.getElementById('frame-dot');
    const a = document.getElementById('read-a');
    const b = document.getElementById('read-b');
    const c = document.getElementById('read-c');
    let t = 0;

    function clamp(v) { return Math.max(-1, Math.min(1, v)); }
    function weight(x, center) {
      const d = Math.abs(x - center);
      return Math.max(.10, 1 - d * 1.35);
    }

    function render(next) {
      t = clamp(next);
      const fx = 91 + ((t + 1) / 2) * 468;
      frame.setAttribute('x', fx.toFixed(1));
      dot.setAttribute('cx', (165 + ((t + 1) / 2) * 570).toFixed(1));

      const wa = weight(t, -0.72);
      const wb = weight(t, 0);
      const wc = weight(t, 0.72);
      const sum = wa + wb + wc;
      a.style.opacity = (wa / sum * .98 + .05).toFixed(3);
      b.style.opacity = (wb / sum * .98 + .05).toFixed(3);
      c.style.opacity = (wc / sum * .98 + .05).toFixed(3);
    }

    function xToT(clientX) {
      const r = root.getBoundingClientRect();
      return ((clientX - r.left) / r.width) * 2 - 1;
    }

    root.addEventListener('pointermove', e => render(xToT(e.clientX)));
    root.addEventListener('pointerdown', e => {
      if (root.setPointerCapture) root.setPointerCapture(e.pointerId);
      render(xToT(e.clientX));
    });
    root.addEventListener('touchmove', e => {
      if (e.touches && e.touches[0]) render(xToT(e.touches[0].clientX));
    }, { passive:true });
    root.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { render(t + .08); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { render(t - .08); e.preventDefault(); }
      if (e.key === 'Home') { render(-1); e.preventDefault(); }
      if (e.key === 'End') { render(1); e.preventDefault(); }
    });

    render(0);
  })();
  </script>
</body>
</html>
