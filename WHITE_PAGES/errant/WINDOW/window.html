<!doctype html>

<title>Errant | Bad Window V</title>
<style>
:root{--wall:#596269;--wall-dark:#4e565c;--ink:#211c24;--stitch:#f8f1dc;--cobalt:#315cff;--violet:#8858db;--copper:#cf705f;--acid:#ffef35;--paper:#f0ecf8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.09),transparent 22%),radial-gradient(circle at 82% 74%,rgba(255,255,255,.05),transparent 28%),linear-gradient(180deg,#626b72 0%,#565f66 55%,#50585f 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 11px);mix-blend-mode:soft-light}
svg{width:min(100vw,750px);height:auto;display:block;overflow:visible;cursor:ew-resize}
.domain{stroke:rgba(248,241,220,.8);stroke-width:1.35;vector-effect:non-scaling-stroke;opacity:.78;transition:fill .12s linear,opacity .12s linear,transform .18s cubic-bezier(.2,.7,.2,1);transform-box:fill-box;transform-origin:center}
.domain[data-state="0"]{fill:var(--cold)}.domain[data-state="1"]{fill:var(--warm)}.domain.jump{filter:brightness(1.1) saturate(1.1)}
.stitch{fill:none;stroke:var(--stitch);stroke-width:1.05;stroke-dasharray:2.4 5.1;vector-effect:non-scaling-stroke;opacity:.92;pointer-events:none}
.misreg{fill:none;stroke:var(--acid);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.72;pointer-events:none}
.ghost{fill:none;stroke:rgba(33,28,36,.14);stroke-width:1.25;vector-effect:non-scaling-stroke;pointer-events:none}
.grain{fill:none;stroke:rgba(33,28,36,.18);stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
.defect{fill:var(--acid);opacity:.85;pointer-events:none}.defect.fire{filter:drop-shadow(0 0 4px rgba(255,239,53,.45));opacity:1}
.pickup{fill:none;stroke:rgba(49,92,255,.74);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.82;pointer-events:none}
.pickup-spike{fill:none;stroke:var(--acid);stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none}.pickup-spike.fire{animation:spike .45s ease-out}@keyframes spike{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.label{font-size:21px;font-weight:700;letter-spacing:2px;fill:var(--stitch)}.caption{font-size:19px;font-weight:700;letter-spacing:1.45px;fill:var(--stitch)}.caption-small{font-size:15px;font-weight:700;letter-spacing:1.3px;fill:var(--stitch)}
@media(prefers-reduced-motion:reduce){.domain{transition:none}.pickup-spike.fire{animation:none;opacity:.55}}
</style>
</head>

<text x="84" y="1104" class="label">BAD WINDOW</text><text x="84" y="1128" class="caption-small">V</text>
<text x="816" y="1093" text-anchor="end" class="caption">BARKHAUSEN EFFECT</text><text x="816" y="1122" text-anchor="end" class="caption-small">STEADY FIELD, ABRUPT DOMAIN JUMPS.</text><text x="816" y="1147" text-anchor="end" class="caption-small">MICROSCOPIC DEFECTS PIN THE BOUNDARIES.</text><text x="816" y="1172" text-anchor="end" class="caption-small">REVERSING THE FIELD DOES NOT RETRACE THE SAME PATH.</text>

<script>
(()=>{const root=document.getElementById('window'),nodes=[...document.querySelectorAll('.domain')],grains=[...document.querySelectorAll('.grain')],defects=[...document.querySelectorAll('.defect')],spike=document.getElementById('pickupSpike');const up=[-.77,-.58,-.35,-.1,-.63,-.41,-.18,.12,-.48,-.23,.04,.28,-.12,.16,.41,.66],down=[-.91,-.77,-.53,-.29,-.8,-.62,-.39,-.08,-.67,-.47,-.19,.06,-.38,-.11,.18,.42],state=new Array(nodes.length).fill(0);let field=-.88,lastField=field;function spikeNow(){spike.classList.remove('fire');void spike.getBoundingClientRect();spike.classList.add('fire')}function render(next){next=Math.max(-1,Math.min(1,next));const rising=next>=lastField;field=next;const changed=[];for(let i=0;i<nodes.length;i++){const prev=state[i];if(rising&&prev===0&&field>=up[i])state[i]=1;if(!rising&&prev===1&&field<=down[i])state[i]=0;if(prev!==state[i])changed.push(i)}if(rising&&changed.includes(10)&&state[9]===0){state[9]=1;changed.push(9)}if(rising&&changed.includes(13)&&state[14]===0){state[14]=1;changed.push(14)}if(!rising&&changed.includes(9)&&state[10]===1&&field<down[10]+.03){state[10]=0;changed.push(10)}if(!rising&&changed.includes(14)&&state[13]===1&&field<down[13]+.04){state[13]=0;changed.push(13)}nodes.forEach((n,i)=>{n.dataset.state=String(state[i]);const bend=field*.75+((i%4)-1.5)*.085,signed=state[i]?1:-1;n.style.transform=`translate(${signed*bend*.8}px,${signed*bend*.28}px) rotate(${signed*bend*.11}deg)`;n.style.opacity=state[i]?.84:.74});grains.forEach((g,i)=>{const signed=state[i]?1:-1;g.style.transform=`rotate(${signed*(field*2.4)}deg)`;g.style.opacity=.14+(state[i]?.08:0);g.style.transformBox='fill-box';g.style.transformOrigin='center'});if(changed.length){const unique=[...new Set(changed)];unique.forEach(i=>{const n=nodes[i];n.classList.remove('jump');void n.getBoundingClientRect();n.classList.add('jump');setTimeout(()=>n.classList.remove('jump'),170);const d=defects[i%defects.length];d.classList.remove('fire');void d.getBoundingClientRect();d.classList.add('fire');setTimeout(()=>d.classList.remove('fire'),180)});spikeNow()}lastField=field}function xf(x){const r=root.getBoundingClientRect();return((x-r.left)/r.width)*2-1}root.addEventListener('pointermove',e=>render(xf(e.clientX)));root.addEventListener('pointerdown',e=>{root.setPointerCapture?.(e.pointerId);render(xf(e.clientX))});root.addEventListener('touchmove',e=>{if(e.touches&&e.touches[0])render(xf(e.touches[0].clientX))},{passive:true});root.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){render(field+.05);e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){render(field-.05);e.preventDefault()}});render(field)})();
</script>
